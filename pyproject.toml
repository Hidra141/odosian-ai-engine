[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "odosian-ai-engine"
version = "0.1.0"
description = "AI-powered cybersecurity reasoning engine for detection rule analysis."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "ODOSIAN" }]
keywords = ["cybersecurity", "detection-engineering", "reasoning", "graphrag", "gemini"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "google-genai>=1.0.0",
    "jsonschema>=4.23",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
graph = [
    "neo4j>=5.24",
]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-jsonschema>=4.23",
    "types-pyyaml>=6.0.12",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "D"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_reexport = true
packages = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
