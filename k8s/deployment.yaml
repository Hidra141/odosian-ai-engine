apiVersion: apps/v1
kind: Deployment
metadata:
  name: odosian-engine
  labels:
    app: odosian-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odosian-engine
  template:
    metadata:
      labels:
        app: odosian-engine
    spec:
      containers:
        - name: engine
          image: odosian-ai-engine:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              protocol: TCP
          env:
            - name: ODOSIAN_ENVIRONMENT
              value: "production"
            - name: ODOSIAN_LOG_LEVEL
              value: "INFO"
            - name: ODOSIAN_LOG_FORMAT
              value: "json"
            - name: ODOSIAN_LOG_OUTPUT
              value: "stdout"
            # Satisfies configs/security.yaml's required_secrets check at
            # startup. Never used for a real LLM call — every request builds
            # its own provider from the api_key/baseUrl/model it carries
            # (see provider_from_request / Pipeline.with_provider); this one
            # only backs the placeholder provider Pipeline.create() needs to
            # build the pipeline object before any request has arrived.
            - name: ODOSIAN_LLM_API_KEY
              value: "server-managed"
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            # On a dev machine running under WSL2, the host VM can be paused
            # and resumed (Windows idle-suspend / sleep) for well over a
            # minute, freezing every container's wall clock along with it.
            # A short failureThreshold reads that as a hung process and
            # kills the container, discarding whatever request was mid-flight
            # even though nothing was actually wrong. 5 failures at 30s apart
            # tolerates a multi-minute freeze before restarting for real.
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 4
